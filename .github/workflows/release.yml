
name: Build and Release M Generation II POS

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS Universal
        run: npm run build && npx electron-builder --mac dmg --universal --publish never


      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/*

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows
        run: npm run build && npx electron-builder --win nsis --publish never


      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/*

  release:
    name: Create GitHub Release
    needs:
      - build-mac
      - build-windows

    runs-on: ubuntu-latest

    steps:
      - name: Download macOS build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: release

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release

      - name: List release files
        run: |
          echo "Files going into GitHub Release:"
          find release -type f -maxdepth 2 -print

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: M Generation II POS ${{ github.ref_name }}
          body: |
            M Generation II POS ${{ github.ref_name }}

            Automatic release containing:
            - macOS Universal installer
            - Windows installer
            - Electron auto-update metadata
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
            release/latest-mac.yml
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}